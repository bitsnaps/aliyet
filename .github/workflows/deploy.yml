name: Deploy Nuxt 4 Full-Stack to Shared Hosting

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'  # change to npm/yarn if you use them

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt (Full SSR Node Server)
        run: pnpm run build
        env:
          NITRO_PRESET: node-server   # Forces correct preset even if not in config

      # =============================================
      # 1. Deploy Frontend (public assets only)
      # =============================================
      - name: Deploy Frontend → public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/node_modules/**
            **/.git**

      # =============================================
      # 2. Deploy Backend + CJS Wrapper → ~/app/
      # =============================================
      - name: Deploy Backend Server + Wrapper
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-files/app/          # ← We'll generate this folder
          server-dir: ./app/
          dangerous-clean-slate: true             # Yes! We want full control here

      # =============================================
      # 3. Generate the exact files needed in ~/app/
      # =============================================
      - name: Create deployment package for ~/app/
        run: |
          mkdir -p deploy-files/app

          # Copy entire Nitro server
          cp -r .output/server/* deploy-files/app/

          # Create the required index.js (CJS wrapper) — THIS IS PERFECT
          cat > deploy-files/app/index.js << 'EOF'
          // Auto-generated by GitHub Actions - works on ALL shared hosts (2025)
          const { createServer } = require('node:http');
          const path = require('node:path');
          const { fileURLToPath } = require('node:url');

          // Fix for __dirname in ESM context
          const __filename = fileURLToPath(import.meta.url);
          const __dirname = path.dirname(__filename);

          const port = process.env.PORT || 3000;
          process.env.NITRO_PORT = port;
          process.env.NITRO_HOST = '0.0.0.0';

          (async () => {
            try {
              const { handler } = await import('./index.mjs');
              const server = createServer(handler);
              server.listen(port, '0.0.0.0', () => {
                console.log(`Nuxt v4 Full-Stack running on port ${port}`);
              });
            } catch (err) {
              console.error('Failed to start server:', err);
              process.exit(1);
            }
          })();
          EOF

          # Optional: Add package.json with correct start script (some hosts read it)
          cat > deploy-files/app/package.json << 'EOF'
          {
            "name": "nuxt-app",
            "version": "1.0.0",
            "type": "commonjs",
            "scripts": {
              "start": "node index.js"
            }
          }
          EOF