name: Deploy Nuxt 4 Full-Stack (No node_modules upload)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build Nuxt (Full SSR)
        run: pnpm run build
        env:
          NITRO_PRESET: node-server

      # =============================================
      # 1. Deploy ONLY static assets → public_html (fast!)
      # =============================================
      - name: Deploy Frontend → public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/node_modules/**
            **/.git**

      # =============================================
      # 2. Deploy ONLY the minimal server files + wrapper
      #    → ~/app/  (no node_modules, no package-lock, nothing heavy)
      # =============================================
      - name: Deploy Minimal Server + Smart Wrapper
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: ./app/
          dangerous-clean-slate: true         # Full control, clean every time

      # =============================================
      # 3. Generate the exact minimal files needed in ~/app/
      # =============================================
      - name: Prepare minimal server package (no node_modules!)
        run: |
          mkdir -p deploy-package

          # Copy only the compiled server (very small: ~3-8 MB total)
          cp -r .output/server/* deploy-package/

          # Remove heavy/unnecessary files we don't want to upload
          rm -rf deploy-package/node_modules
          rm -rf deploy-package/package.json deploy-package/*.lock || true

          # === PERFECT index.js wrapper (2025 gold standard) ===
          cat > deploy-package/index.js << 'EOF'
          // Auto-generated by GitHub Actions — works on ALL cPanel hosts
          // Supports dynamic import of Nitro ESM server from CommonJS
          const { createServer } = require('node:http');

          const port = process.env.PORT || 3000;
          process.env.NITRO_PORT = port;
          process.env.NITRO_HOST = '0.0.0.0';

          (async () => {
            try {
              const { handler } = await import('./index.mjs');
              const server = createServer(handler);
              server.listen(port, '0.0.0.0', () => {
                console.log(`Nuxt 4 SSR Server running on port ${port}`);
              });
            } catch (err) {
              console.error('Server failed to start:', err);
              process.exit(1);
            }
          })();
          EOF

          # === Tiny package.json — makes "Run NPM Install" work perfectly ===
          cat > deploy-package/package.json << 'EOF'
          {
            "name": "nuxt-app",
            "version": "1.0.0",
            "type": "commonjs",
            "private": true,
            "dependencies": {},
            "scripts": {
              "start": "node index.js"
            }
          }
          EOF